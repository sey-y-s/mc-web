<a
  href="#main-content"
  class="sr-only rounded-lg bg-brand-600 px-4 py-3 font-semibold text-white focus:not-sr-only focus:fixed focus:left-3 focus:top-3 focus:z-99999"
>Aller au contenu principal</a>

<div class="min-h-screen xl:flex bg-gray-50 dark:bg-gray-950">
  @if (navigationOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-40 bg-gray-950/50 backdrop-blur-[2px] xl:hidden"
      (click)="closeMobileNavigation()"
      aria-label="Fermer le menu de navigation"
    ></button>
  }

  <aside
    id="mc-navigation"
    class="mc-sidebar fixed inset-y-0 left-0 z-50 flex flex-col border-r border-gray-200 bg-white transition-all duration-300 ease-in-out dark:border-gray-800 dark:bg-gray-900"
    [class.mc-sidebar-mobile-open]="navigationOpen()"
    [class.mc-sidebar-collapsed]="sidebarCollapsed() && !sidebarHovered()"
  >
    <app-sidebar
      [collapsed]="sidebarCollapsed() && !sidebarHovered() && !navigationOpen()"
      (hoverChange)="setSidebarHovered($event)"
      (navigateRequested)="closeMobileNavigation()"
    />
  </aside>

  <div
    class="mc-shell-content min-w-0 flex-1 transition-all duration-300 ease-in-out"
    [class.mc-shell-content-collapsed]="sidebarCollapsed() && !sidebarHovered()"
  >
    <app-header
      [navigationOpen]="navigationOpen()"
      [sidebarCollapsed]="sidebarCollapsed()"
      (toggleNavigation)="toggleMobileNavigation()"
      (toggleSidebar)="toggleSidebar()"
    />
    <main
      id="main-content"
      tabindex="-1"
      class="mx-auto min-h-[calc(100vh-140px)] w-full max-w-[1600px] px-4 py-6 outline-none sm:px-6 lg:px-8"
    >
      <router-outlet />
    </main>
    <footer class="border-t border-gray-200 bg-white px-4 py-4 text-center text-xs text-gray-500 dark:border-gray-800 dark:bg-gray-900 dark:text-gray-400 sm:px-6 lg:px-8">
      MaliCompétences · Espace professionnel
    </footer>
  </div>
</div>

<mc-confirmation-dialog />
