<a class="skip-link" href="#main-content">Aller au contenu principal</a>
<div class="drawer min-h-screen bg-base-200 lg:drawer-open">
  <input #drawerToggle id="mc-drawer" type="checkbox" class="drawer-toggle" aria-label="Afficher la navigation" />
  <div class="drawer-content flex min-h-screen min-w-0 flex-col">
    <app-header [navigationOpen]="navigationOpen" (toggleNavigation)="toggleMobileNavigation()" />
    <main id="main-content" tabindex="-1" class="mx-auto w-full max-w-[1440px] flex-1 px-4 py-6 sm:px-6 lg:px-8">
      <router-outlet />
    </main>
    <footer class="border-t border-base-300 bg-base-100 px-5 py-4 text-xs text-base-content/60 sm:px-8">
      MaliCompétences · Espace professionnel
    </footer>
  </div>
  <div class="drawer-side z-40">
    <label for="mc-drawer" class="drawer-overlay" aria-label="Fermer la navigation"></label>
    <app-sidebar id="mc-navigation" (navigateRequested)="closeMobileNavigation()" />
  </div>
</div>

<mc-confirmation-dialog />
