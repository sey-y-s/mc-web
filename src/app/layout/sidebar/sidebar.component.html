<aside class="w-64 shrink-0 border-r border-base-300 bg-white">
  <div class="sticky top-0 h-screen overflow-y-auto px-3 pb-5 pt-4">
    <a routerLink="/dashboard" class="mb-7 flex items-center gap-3 px-2">
      <span
        class="flex h-9 w-9 items-center justify-center rounded-md bg-primary text-sm font-bold text-primary-content"
        >MC</span
      >
      <span
        ><strong class="block text-sm">MaliCompétences</strong
        ><span class="text-xs text-base-content/50">Espace professionnel</span></span
      >
    </a>
    @for (section of sections(); track section) {
      <div class="mb-5">
        <p
          class="px-3 pb-2 text-[10px] font-semibold uppercase tracking-wider text-base-content/45"
        >
          {{ section }}
        </p>
        <nav class="space-y-0.5">
          @for (item of bySection(section); track item.path) {
            <a
              [routerLink]="item.path"
              routerLinkActive="bg-primary/10 text-primary font-semibold"
              [routerLinkActiveOptions]="{ exact: true }"
              class="block rounded-md px-3 py-2 text-sm text-base-content/70 hover:bg-base-200 hover:text-base-content"
              >{{ item.label }}</a
            >
          }
        </nav>
      </div>
    }
  </div>
</aside>
