<aside id="mc-navigation-panel" class="min-h-full w-72 border-r border-base-300 bg-base-100 lg:w-64" aria-label="Navigation de l’espace professionnel">
  <div class="flex min-h-full flex-col px-3 pb-5 pt-5">
    <a routerLink="/app/dashboard" (click)="onNavigate()" class="mb-8 flex items-center gap-3 rounded-sm px-2 py-2" aria-label="MaliCompétences, vue d’ensemble">
      <span class="h-9 w-1 rounded-full bg-secondary" aria-hidden="true"></span>
      <span>
        <strong class="block text-base tracking-tight">MaliCompétences</strong>
        <span class="text-xs text-base-content/60">Espace professionnel</span>
      </span>
    </a>

    <div class="mb-5 px-2">
      <p class="text-[10px] font-bold uppercase tracking-[0.18em] text-base-content/45">Navigation</p>
    </div>
    @for (section of sections(); track section) {
      <section class="mb-5" [attr.aria-label]="section">
        <h2 class="px-3 pb-2 text-[10px] font-bold uppercase tracking-[0.16em] text-base-content/55">{{ section }}</h2>
        <nav class="space-y-1" [attr.aria-label]="section">
          @for (item of bySection(section); track item.path) {
            <a
              [routerLink]="item.path"
              (click)="onNavigate()"
              routerLinkActive="bg-mc-green-50 text-mc-green-950 font-semibold border-l-[3px] border-primary pl-[9px]"
              [routerLinkActiveOptions]="{ exact: item.path === '/app/dashboard' || item.path === '/app/organisation' || item.path === '/app/admin/dashboard' }"
              ariaCurrentWhenActive="page"
              class="block rounded-r-md border-l-[3px] border-transparent px-3 py-2.5 text-sm text-base-content/75 transition-colors hover:bg-base-200 hover:text-base-content"
            >{{ item.label }}</a>
          }
        </nav>
      </section>
    }
  </div>
</aside>
