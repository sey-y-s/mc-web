<header class="sticky top-0 z-20 border-b border-gray-200 bg-white/95 backdrop-blur dark:border-gray-800 dark:bg-gray-900/95">
  <div class="flex min-h-14 items-center justify-between gap-2 px-4 sm:px-6 lg:px-8">
    <div class="flex min-w-0 items-center gap-3">
      <button
        type="button"
        class="rounded-control border border-gray-300 px-3 py-1.5 text-sm font-semibold text-gray-800 hover:bg-gray-50 lg:hidden"
        (click)="toggleNavigation.emit()"
        aria-controls="mc-navigation"
        [attr.aria-expanded]="navigationOpen"
      >{{ navigationOpen ? 'Fermer' : 'Menu' }}</button>
      <p class="hidden truncate text-sm font-medium text-gray-700 dark:text-gray-200 sm:block">{{ workspaceLabel(auth.getCurrentUser()?.role) }}</p>
    </div>

    <nav class="flex shrink-0 items-center gap-0.5 text-sm font-medium" aria-label="Compte">
      <a routerLink="/app/notifications" class="rounded-control px-3 py-2 text-gray-700 hover:bg-gray-100 dark:text-gray-200 dark:hover:bg-white/5">Notifications</a>
      <a routerLink="/app/profil" class="rounded-control px-3 py-2 text-gray-700 hover:bg-gray-100 dark:text-gray-200 dark:hover:bg-white/5">Profil</a>
      <button type="button" class="rounded-control px-3 py-2 text-gray-700 hover:bg-gray-100 dark:text-gray-200 dark:hover:bg-white/5" (click)="auth.logout()">
        <span class="sm:hidden">Sortir</span><span class="hidden sm:inline">Se déconnecter</span>
      </button>
    </nav>
  </div>
</header>
