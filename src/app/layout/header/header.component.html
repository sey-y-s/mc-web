<header class="sticky top-0 z-20 border-b border-base-300 bg-base-100">
  <div class="flex min-h-16 items-center justify-between gap-3 px-4 sm:px-6 lg:px-8">
    <div class="flex min-w-0 items-center gap-3">
      <button type="button" class="btn btn-ghost btn-square btn-sm lg:hidden" (click)="toggleNavigation.emit()" aria-controls="mc-navigation" [attr.aria-expanded]="navigationOpen" [attr.aria-label]="navigationOpen ? 'Fermer la navigation' : 'Ouvrir la navigation'">
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <div class="min-w-0">
        <p class="truncate text-sm font-semibold text-base-content">{{ workspaceLabel(auth.getCurrentUser()?.role) }}</p>
        <p class="hidden text-xs text-base-content/60 sm:block">MaliCompétences</p>
      </div>
    </div>
    <div class="flex shrink-0 items-center gap-2 sm:gap-4">
      <a routerLink="/app/notifications" class="btn btn-ghost btn-square btn-sm sm:w-auto sm:px-3" aria-label="Notifications">
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
        </svg>
        <span class="sr-only sm:not-sr-only sm:ml-2">Notifications</span>
      </a>
      <a routerLink="/app/profil" class="flex items-center gap-2 rounded-sm" aria-label="Mon profil">
        <span class="flex h-8 w-8 items-center justify-center rounded-full bg-mc-green-100 text-xs font-bold text-mc-green-950" aria-hidden="true">{{ auth.getCurrentUser()?.role?.slice(0, 2) }}</span>
        <!-- <span class="hidden max-w-36 truncate text-sm font-medium sm:block">{{ auth.getCurrentUser()?.role }}</span> -->
      </a>
      <button class="btn btn-ghost btn-sm rounded-md px-2 sm:px-3" (click)="auth.logout()"><span class="sm:hidden">Sortir</span><span class="hidden sm:inline">Déconnexion</span></button>
    </div>
  </div>
</header>
