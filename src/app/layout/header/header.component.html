<header class="sticky top-0 z-20 border-b border-base-300 bg-white/95 backdrop-blur">
  <div class="flex h-16 items-center justify-between px-5">
    <div class="text-sm text-base-content/50">Espace professionnel</div>
    <div class="flex items-center gap-4">
      <a routerLink="/notifications" class="text-sm text-base-content/60 hover:text-primary"
        >Notifications</a
      >
      <a routerLink="/profil" class="flex items-center gap-2">
        <span
          class="flex h-8 w-8 items-center justify-center rounded-full bg-primary/10 text-xs font-semibold text-primary"
          >{{ auth.getCurrentUser()?.role?.slice(0, 2) }}</span
        >
        <span class="hidden text-sm font-medium sm:block">{{ auth.getCurrentUser()?.role }}</span>
      </a>
      <button class="btn btn-ghost btn-sm rounded-md" (click)="auth.logout()">Déconnexion</button>
    </div>
  </div>
</header>
