<nav aria-label="Progression">
  <ol class="flex items-start">
    @for (libelle of steps(); track libelle; let i = $index; let dernier = $last) {
      <li class="min-w-0 flex-1 last:flex-none">
        <div class="flex items-center">
          <button
            type="button"
            class="mx-1.5 my-1.5 shrink-0 rounded-[3px] disabled:cursor-default"
            [disabled]="i >= current()"
            (click)="stepSelected.emit(i)"
            [attr.aria-current]="i === current() ? 'step' : null"
            [attr.aria-label]="texteAccessible(i)"
          >
            <span
              class="grid size-6 rotate-45 place-items-center rounded-[3px] border-2 text-xs font-semibold transition-colors"
              [class]="
                etat(i) === 'fait'
                  ? 'border-brand-600 bg-brand-600 text-white'
                  : etat(i) === 'en-cours'
                    ? 'border-brand-600 bg-white text-brand-700 shadow-focus-ring'
                    : 'border-dashed border-gray-400 bg-white text-gray-500'
              "
            ><span class="-rotate-45 tabular-nums">{{ i + 1 }}</span></span>
          </button>
          @if (!dernier) {
            <span class="mx-1 h-0 flex-1 border-t-2" [class]="i < current() ? 'border-brand-600' : 'border-dashed border-gray-300'" aria-hidden="true"></span>
          }
        </div>
        <p class="mt-1.5 hidden pr-2 text-xs leading-4 sm:block" [class]="i === current() ? 'font-semibold text-gray-900' : 'text-gray-600'">{{ libelle }}</p>
      </li>
    }
  </ol>
  <p class="mt-3 text-sm font-semibold text-gray-900 sm:hidden" aria-live="polite">Étape {{ current() + 1 }} sur {{ steps().length }} · {{ libelleCourant() }}</p>
</nav>
