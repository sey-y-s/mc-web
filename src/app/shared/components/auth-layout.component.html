<a
  href="#main-content"
  class="sr-only rounded-control bg-brand-600 px-4 py-3 font-semibold text-white focus:not-sr-only focus:fixed focus:left-3 focus:top-3 focus:z-99999"
>Aller au contenu principal</a>

<div class="min-h-screen bg-base-100 lg:grid lg:grid-cols-[26rem_minmax(0,1fr)] xl:grid-cols-[30rem_minmax(0,1fr)]">
  <aside class="relative isolate flex flex-col overflow-hidden bg-brand-950 text-white">
    <div class="motif-bogolan-fond absolute inset-0 -z-10 text-brand-800/35" aria-hidden="true"></div>

    <div class="flex items-center gap-3 px-6 py-5 lg:px-10 lg:pt-10">
      <span class="barre-mali-v shrink-0" aria-hidden="true"></span>
      <div>
        <p class="font-display text-title-sm font-semibold leading-6">MaliCompétences</p>
        <p class="text-theme-xs text-brand-200">Espace professionnel</p>
      </div>
    </div>

    <div class="hidden flex-1 flex-col justify-center px-10 py-10 lg:flex">
      <h2 class="font-display text-[2rem] font-semibold leading-[1.15] tracking-tight">
        Des compétences visibles.<br />Des preuves vérifiables.
      </h2>
      <p class="mt-4 max-w-sm text-sm leading-6 text-brand-100">
        Une compétence déclarée n’est jamais présentée comme vérifiée sans justification.
      </p>

      <figure class="mt-10 max-w-sm rounded-panel bg-white p-4 text-gray-900 shadow-theme-lg">
        <figcaption class="mb-3 text-theme-xs font-medium text-gray-500">Exemple de lecture d’un Passeport Compétences</figcaption>
        <ul class="space-y-2">
          <li class="flex items-center justify-between gap-3 rounded-control border border-gray-300 px-3 py-2.5">
            <span class="text-sm font-medium">Soudure à l’arc</span>
            <mc-status-badge value="VERIFIEE" />
          </li>
          <li class="flex items-center justify-between gap-3 rounded-control border border-dashed border-gray-400 px-3 py-2.5">
            <span class="text-sm font-medium">Couture sur mesure</span>
            <mc-status-badge value="DECLAREE" />
          </li>
        </ul>
        <p class="mt-3 text-theme-xs leading-5 text-gray-500">Trait plein : preuve examinée. Pointillés : simple déclaration.</p>
      </figure>
    </div>

    <div class="barre-mali mt-auto h-1.5! w-full!" aria-hidden="true"></div>
  </aside>

  <main id="main-content" tabindex="-1" class="flex min-w-0 items-start justify-center px-5 py-10 focus:outline-none sm:px-8 lg:items-center lg:py-12">
    <div class="w-full" [class.max-w-md]="!large()" [class.max-w-3xl]="large()">
      <ng-content />
    </div>
  </main>
</div>
