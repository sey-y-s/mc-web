<a
  href="#main-content"
  class="sr-only rounded-control bg-brand-600 px-4 py-3 font-semibold text-white focus:not-sr-only focus:fixed focus:left-3 focus:top-3 focus:z-99999"
>Aller au contenu principal</a>

<div class="min-h-screen bg-base-100 lg:grid lg:grid-cols-[26rem_minmax(0,1fr)] xl:grid-cols-[30rem_minmax(0,1fr)]">
  <aside class="relative flex flex-col overflow-hidden bg-brand-950 text-white">
    <div class="flex items-center gap-3 px-6 py-5 lg:px-10 lg:pt-10">
      <span class="barre-mali-v shrink-0" aria-hidden="true"></span>
      <div>
        <p class="font-display text-title-sm font-semibold leading-6">MaliCompétences</p>
        <p class="text-theme-xs text-brand-200">Espace professionnel</p>
      </div>
    </div>

    <div class="hidden flex-1 flex-col justify-center px-10 py-10 lg:flex">
      <h1 class="max-w-lg font-display text-3xl font-semibold leading-tight tracking-tight xl:text-4xl">
        Les compétences du Mali,
        <span class="text-brand-300">mieux connues et valorisées.</span>
      </h1>
      <p class="mt-5 max-w-sm text-sm leading-6 text-brand-100">
        Un espace dédié aux acteurs qui valorisent, vérifient et recherchent les compétences au Mali.
      </p>
    </div>

    <!-- Bande de bogolan, sur toute la largeur du panneau. Version courte sur mobile. -->
    <div class="mt-2 lg:mt-0" aria-hidden="true">
      <div class="motif-bogolan-dents revelation text-white/90"></div>
      <div class="motif-bogolan-chevrons revelation mt-2 text-brand-300 [--delai:120ms]"></div>
      <div class="hidden lg:block">
        <div class="motif-bogolan-losanges revelation mt-2 text-white/90 [--delai:240ms]"></div>
        <div class="motif-bogolan-croix revelation mt-2 text-brand-300/80 [--delai:360ms]"></div>
        <div class="motif-bogolan-chevrons revelation mt-2 text-white/70 [--delai:480ms]"></div>
        <div class="motif-bogolan-points revelation mt-2 text-white/50 [--delai:600ms]"></div>
      </div>
    </div>

    <!-- <dl class="hidden gap-x-6 gap-y-1 px-10 pb-6 pt-5 text-theme-xs text-brand-100 lg:flex lg:flex-wrap">
      <div class="flex items-center gap-2"><dt><span class="inline-block h-0 w-7 border-t-2 border-white/90" aria-hidden="true"></span><span class="sr-only">Trait plein</span></dt><dd>preuve examinée</dd></div>
      <div class="flex items-center gap-2"><dt><span class="inline-block h-0 w-7 border-t-2 border-dashed border-white/90" aria-hidden="true"></span><span class="sr-only">Pointillés</span></dt><dd>simple déclaration</dd></div>
    </dl> -->
    <dl class="hidden gap-x-6 gap-y-1 px-10 pb-6 pt-5 text-theme-xs text-brand-100 lg:flex lg:flex-wrap">
    </dl>

    <div class="barre-mali h-1.5! w-full!" aria-hidden="true"></div>
  </aside>

  <main id="main-content" tabindex="-1" class="flex min-w-0 items-start justify-center px-5 py-10 focus:outline-none sm:px-8 lg:items-center lg:py-12">
    <div class="w-full" [class.max-w-md]="!large()" [class.max-w-3xl]="large()">
      <ng-content />
    </div>
  </main>
</div>
