<a class="skip-link" href="#auth-title">Aller au contenu principal</a>
<div id="main-content" class="min-h-screen bg-base-200 px-4 py-10">
  <div class="mx-auto max-w-md">
    <div class="mb-8 flex flex-col justify-center items-center gap-y-5">
      <img class="w-24" src="/images/logo.png" alt="Logo MaliCompétences" />
      <p class="text-center">
        <strong class="block">MaliCompétences</strong>
        <span class="text-xs text-base-content/50">Espace professionnel</span>
      </p>
    </div>
    <section class="mc-card p-6 sm:p-8">
      <h1 id="auth-title" class="text-xl font-semibold">Connexion</h1>
      <p class="mc-muted mt-1">Accédez à votre espace professionnel.</p>
      @if (error()) {
        <div class="alert alert-error mt-5 rounded-md py-3 text-sm">{{ error() }}</div>
      }
      <form class="mt-6 space-y-5" (ngSubmit)="submit()">
        <label class="block"
          ><span class="mc-label">Téléphone ou e-mail</span
          ><input
            class="mc-input"
            name="identifier"
            [(ngModel)]="identifier"
            required
            autocomplete="username"
        /></label>
        <label class="block"
          ><span class="mc-label">Mot de passe</span
          ><input
            class="mc-input"
            name="password"
            [(ngModel)]="password"
            type="password"
            required
            minlength="8"
            autocomplete="current-password"
        /></label>
        <button class="btn btn-primary w-full rounded-md" [disabled]="loading()">
          {{ loading() ? 'Connexion…' : 'Se connecter' }}
        </button>
      </form>
      <p class="mt-6 text-center text-sm text-base-content/60">
        Vous représentez une organisation ?
        <a routerLink="/auth/register" class="mc-link font-medium">Créer un compte</a>
      </p>
    </section>
  </div>
</div>
