<mc-auth-layout>
  <section aria-labelledby="auth-title">
    <h1 id="auth-title" class="font-display text-2xl font-semibold tracking-tight text-gray-900">Connexion</h1>
    <p class="mc-muted mt-1">Accédez à votre espace professionnel.</p>

    @if (error()) {
      <div class="alert alert-error mt-6" role="alert">{{ error() }}</div>
    }

    <form class="mt-6 space-y-5" (ngSubmit)="submit()">
      <div>
        <label class="mc-label" for="identifier">Téléphone ou e-mail</label>
        <input
          id="identifier"
          class="mc-input"
          name="identifier"
          [(ngModel)]="identifier"
          required
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          aria-describedby="identifier-aide"
        />
        <p id="identifier-aide" class="mt-1.5 text-theme-xs text-gray-600">Celui que vous avez utilisé à l’inscription.</p>
      </div>

      <div>
        <label class="mc-label" for="password">Mot de passe</label>
        <div class="relative">
          <input
            id="password"
            class="mc-input pr-28"
            name="password"
            [(ngModel)]="password"
            [type]="showPassword() ? 'text' : 'password'"
            required
            minlength="8"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="absolute right-1.5 top-1/2 -translate-y-1/2 rounded-control px-2.5 py-1.5 text-sm font-semibold text-brand-700 hover:bg-brand-50"
            [attr.aria-pressed]="showPassword()"
            (click)="showPassword.set(!showPassword())"
          >{{ showPassword() ? 'Masquer' : 'Afficher' }}</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-full" [disabled]="loading()">
        @if (loading()) { <span class="loading loading-xs border-white border-t-transparent" aria-hidden="true"></span> }
        {{ loading() ? 'Connexion en cours…' : 'Se connecter' }}
      </button>
    </form>

    <div class="mt-8 border-t border-gray-200 pt-6">
      <p class="text-sm text-gray-700">Vous représentez une organisation ?</p>
      <a routerLink="/auth/register" class="btn btn-secondary mt-3 w-full">Créer un compte organisation</a>
      <p class="mt-4 text-theme-xs text-gray-600">L’application mobile est destinée aux citoyens.</p>
    </div>
  </section>
</mc-auth-layout>
