<mc-auth-layout>
  <section aria-labelledby="auth-title">
    <h1 id="auth-title" class="font-display text-3xl font-semibold tracking-tight text-gray-900">Mot de passe oublié</h1>
    <p class="mc-muted mt-1">Indiquez le téléphone ou l’e-mail de votre compte. Nous vous envoyons un code pour choisir un nouveau mot de passe.</p>

    @if (error()) {
      <div class="alert alert-error mt-6" role="alert">{{ error() }}</div>
    }

    <form class="mt-6 space-y-5" (ngSubmit)="envoyer()">
      <div>
        <label class="mc-label" for="identifiant">Téléphone ou e-mail</label>
        <input
          id="identifiant"
          class="mc-input"
          name="identifiant"
          [ngModel]="identifiant()"
          (ngModelChange)="identifiant.set($event)"
          required
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
        />
      </div>
      <button type="submit" class="btn btn-primary w-full" [disabled]="loading() || !valide()">
        @if (loading()) { <span class="loading loading-xs border-white border-t-transparent" aria-hidden="true"></span> }
        {{ loading() ? 'Envoi en cours…' : 'Recevoir un code' }}
      </button>
    </form>

    <p class="mt-6 text-sm"><a routerLink="/auth/login" class="mc-link">Retour à la connexion</a></p>
  </section>
</mc-auth-layout>
