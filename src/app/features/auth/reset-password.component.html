<mc-auth-layout>
  <section aria-labelledby="auth-title">
    <h1 id="auth-title" class="font-display text-3xl font-semibold tracking-tight text-gray-900">Nouveau mot de passe</h1>
    <p class="mc-muted mt-1">Saisissez le code reçu, puis choisissez un nouveau mot de passe.</p>

    @if (error()) {
      <div class="alert alert-error mt-6" role="alert">{{ error() }}</div>
    }
    @if (info()) {
      <div class="alert alert-success mt-6" role="status">{{ info() }}</div>
    }

    <form class="mt-6 space-y-5" (ngSubmit)="valider()">
      <div>
        <label class="mc-label" for="identifiant">Téléphone ou e-mail</label>
        <input id="identifiant" class="mc-input" name="identifiant" [ngModel]="identifiant()" (ngModelChange)="identifiant.set($event)"
               required autocomplete="username" autocapitalize="none" spellcheck="false" />
      </div>

      <div>
        <label class="mc-label" for="code">Code reçu</label>
        <input id="code" class="mc-input text-center text-2xl tracking-[0.4em]" name="code" [ngModel]="code()" (ngModelChange)="code.set($event)"
               inputmode="numeric" autocomplete="one-time-code" required />
      </div>

      <div>
        <div class="flex items-end justify-between">
          <label class="mc-label" for="motDePasse">Nouveau mot de passe</label>
          <button type="button" class="mb-1.5 rounded-control px-2 py-1 text-sm font-semibold text-brand-700 hover:bg-brand-50"
                  [attr.aria-pressed]="afficher()" (click)="afficher.set(!afficher())">{{ afficher() ? 'Masquer' : 'Afficher' }}</button>
        </div>
        <input id="motDePasse" class="mc-input" name="motDePasse" [ngModel]="motDePasse()" (ngModelChange)="motDePasse.set($event)"
               [type]="afficher() ? 'text' : 'password'" required minlength="8" maxlength="100" autocomplete="new-password"
               aria-describedby="mdp-aide" [attr.aria-invalid]="motDePasse() && !longueurOk() ? 'true' : null" />
        <p id="mdp-aide" class="mt-1.5 text-theme-xs" [class]="motDePasse() && !longueurOk() ? 'text-error-700' : 'text-gray-600'">
          8 caractères au minimum.
        </p>
      </div>

      <div>
        <label class="mc-label" for="confirmation">Confirmer le mot de passe</label>
        <input id="confirmation" class="mc-input" name="confirmation" [ngModel]="confirmation()" (ngModelChange)="confirmation.set($event)"
               [type]="afficher() ? 'text' : 'password'" required autocomplete="new-password"
               [attr.aria-invalid]="confirmation() && !identiques() ? 'true' : null" aria-describedby="conf-aide" />
        <p id="conf-aide" class="mt-1.5 text-theme-xs text-error-700" aria-live="polite">
          @if (confirmation() && !identiques()) { Les deux mots de passe ne sont pas identiques. }
        </p>
      </div>

      <button type="submit" class="btn btn-primary w-full" [disabled]="loading() || !valide()">
        @if (loading()) { <span class="loading loading-xs border-white border-t-transparent" aria-hidden="true"></span> }
        {{ loading() ? 'Enregistrement…' : 'Changer le mot de passe' }}
      </button>
    </form>

    <div class="mt-6 flex items-center justify-between text-sm">
      <button type="button" class="mc-link font-medium disabled:opacity-60" [disabled]="attente() > 0" (click)="renvoyer()">
        {{ attente() > 0 ? 'Renvoyer le code dans ' + attente() + ' s' : 'Renvoyer le code' }}
      </button>
      <a routerLink="/auth/login" class="mc-link">Retour à la connexion</a>
    </div>
  </section>
</mc-auth-layout>
