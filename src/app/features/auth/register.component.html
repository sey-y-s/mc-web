<a class="skip-link" href="#auth-title">Aller au contenu principal</a>
<div id="main-content" class="min-h-screen bg-base-200 px-4 py-10">
  <div class="mx-auto max-w-md lg:max-w-xl">
    <!-- <div class="mb-8 flex items-center gap-3">
      <img class="w-12" src="/images/logo.png" alt="Logo MaliCompétences" />
      <span class="h-10 w-0.5 rounded-full bg-secondary" aria-hidden="true"></span>
      <div>
        <strong class="block">MaliCompétences</strong>
        <span class="text-xs text-base-content/50">Espace professionnel</span>
      </div>
    </div> -->

    <section class="mc-card p-6 sm:p-8">
      <h1 id="auth-title" class="text-xl font-semibold">Créer un compte organisation</h1>
      <!-- <p class="mc-muted mt-1">L'accès citoyen reste sur l'application mobile.</p> -->

      @if (error()) {
        <div class="alert alert-error mt-5 rounded-md py-3 text-sm" role="alert">{{ error() }}</div>
      }

      <form class="mt-6 space-y-5" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <label class="block">
          <span class="mc-label">Nom de l'organisation</span>
          <input class="mc-input" formControlName="nomOrganisation" autocomplete="organization"
                [attr.aria-invalid]="invalid('nomOrganisation')" />
          @if (invalid('nomOrganisation', 'required')) { <small class="text-error">Le nom est obligatoire.</small> }
          @if (invalid('nomOrganisation', 'maxlength')) { <small class="text-error">150 caractères maximum.</small> }
        </label>

        <label class="block">
          <span class="mc-label">Numéro RCCM <span class="font-normal text-base-content/40">(si disponible)</span></span>
          <input class="mc-input" formControlName="numeroRccm" autocomplete="off" placeholder="Ex. : MA.BKO.2026.B.12345" />
          @if (invalid('numeroRccm', 'maxlength')) { <small class="text-error">80 caractères maximum.</small> }
          <small class="mt-1 block text-base-content/60">Il aidera à vérifier l’existence légale de l’organisation.</small>
        </label>

        <label class="block">
          <span class="mc-label">Présentation <span class="font-normal text-base-content/40">(facultatif)</span></span>
          <textarea class="mc-input" rows="3" formControlName="descriptionOrganisation"
                    placeholder="Activité, secteur, zones d'intervention…"></textarea>
          @if (invalid('descriptionOrganisation', 'maxlength')) { <small class="text-error">500 caractères maximum.</small> }
        </label>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <label class="block">
            <span class="mc-label">Téléphone</span>
            <input class="mc-input" formControlName="telephone" type="tel" autocomplete="tel"
                  placeholder="70 00 00 00" [attr.aria-invalid]="invalid('telephone')" />
            @if (invalid('telephone', 'required')) { <small class="text-error">Le téléphone est obligatoire.</small> }
            @if (invalid('telephone', 'maliPhone')) { <small class="text-error">8 chiffres (ex. 70 00 00 00).</small> }
          </label>

          <label class="block">
            <span class="mc-label">E-mail</span>
            <input class="mc-input" formControlName="email" type="email" autocomplete="email"
                  [attr.aria-invalid]="invalid('email')" />
            @if (invalid('email', 'required')) { <small class="text-error">L'e-mail est obligatoire.</small> }
            @if (invalid('email', 'email')) { <small class="text-error">Adresse e-mail invalide.</small> }
          </label>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <label class="block">
            <span class="mc-label">Mot de passe</span>
            <input class="mc-input" formControlName="password" type="password" autocomplete="new-password"
                  [attr.aria-invalid]="invalid('password')" />
            @if (invalid('password', 'required') || invalid('password', 'minlength')) {
              <small class="text-error">Au moins 8 caractères.</small>
            }
          </label>

          <label class="block">
            <span class="mc-label">Confirmation du mot de passe</span>
            <input class="mc-input" formControlName="confirmation" type="password" autocomplete="new-password" />
            @if (passwordsDiffer) { <small class="text-error">Les mots de passe ne correspondent pas.</small> }
          </label>
        </div>

        <button class="btn btn-primary w-full rounded-md" [disabled]="loading()">
          {{ loading() ? 'Création…' : 'Créer le compte' }}
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-base-content/60">
        <a routerLink="/auth/login" class="mc-link font-medium">Retour à la connexion</a>
      </p>
    </section>
  </div>
</div>
