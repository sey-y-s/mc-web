<mc-page-header
  title="Mon organisation"
  description="Informations de l'organisation et statut de son compte professionnel."
/>
@if (loading) {
  <div class="mc-card animate-pulse p-6" role="status">Chargement des informations de l’organisation…</div>
} @else if (error) {
  <div class="alert alert-error" role="alert">{{ error }}</div>
} @else if (organisation; as data) {
  <section class="mc-card max-w-3xl p-6">
    <div class="grid gap-5 sm:grid-cols-2">
      <div>
        <label class="mc-label">Nom</label>
        <input class="mc-input" [value]="data.nom" disabled />
      </div>
      <div>
        <label class="mc-label">Statut</label>
        <input class="mc-input" [value]="data.statut ?? 'Non renseigné'" disabled />
      </div>
      <div class="sm:col-span-2">
        <label class="mc-label">E-mail du compte associé</label>
        <input class="mc-input" [value]="data.utilisateurEmail ?? 'Non renseigné'" disabled />
      </div>
      <div class="sm:col-span-2">
        <label class="mc-label">Description</label>
        <textarea class="mc-input" rows="4" [value]="data.description ?? 'Aucune description renseignée.'" disabled></textarea>
      </div>
    </div>
  </section>
}
