<mc-page-header
  title="Suivi besoin/talent"
  description="Gérer les talents suivis et leurs statuts."
/>

<section class="mc-card overflow-hidden p-1 sm:p-2">
  @if (error) {
    <div class="alert alert-warning m-4" role="status">{{ error }}</div>
  } @else {
  <div class="overflow-x-auto">
    <table class="mc-table">
      <thead>
        <tr>
          <th>Talent</th>
          <th>Besoin</th>
          <th>Statut</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows; track row.id) {
          <tr>
            <td class="font-medium">{{ row.citoyenId }}</td>
            <td>{{ row.besoinId }}</td>
            <td>
              <select
                class="mc-input min-w-48"
                [ngModel]="row.statut"
                (ngModelChange)="changerStatut(row, $event)"
                [disabled]="pending.has(row.id)"
                [attr.aria-label]="'Statut du talent ' + row.citoyenId"
              >
                <option value="A_L_ETUDE">À l’étude</option>
                <option value="CONTACT_EN_COURS">Contact en cours</option>
                <option value="MISE_EN_RELATION">Mise en relation</option>
                <option value="ARCHIVE">Archivé</option>
              </select>
            </td>
            <td>
              <div class="flex items-center gap-3">
                <progress class="progress progress-primary w-20" [value]="row.scoreCorrespondance ?? 0" max="100"></progress>
                <span class="font-semibold tabular-nums">{{ row.scoreCorrespondance ?? 0 }}%</span>
              </div>
            </td>
          </tr>
        }
        @if (!rows.length) {
          <tr>
            <td colspan="4" class="px-4 py-12 text-center">
              <div class="font-medium">Aucun talent suivi</div>
              <p class="mt-1 text-sm text-base-content/60">Les profils ajoutés à votre suivi apparaîtront ici.</p>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
  }
</section>
