<mc-page-header
  title="Créer un besoin"
  description="Définir les compétences, le niveau, la quantité et les dates."
/>

@if (loading) {
  <div class="mc-card p-6" role="status">Chargement des informations nécessaires…</div>
} @else {
<section class="mc-card max-w-4xl p-6">
  @if (error) {
    <div class="alert alert-error mb-5" role="alert">{{ error }}</div>
  }
  <div class="grid gap-5 md:grid-cols-2">
    <label class="block md:col-span-2">
      <span class="mc-label">Titre</span>
      <input class="mc-input" [(ngModel)]="titre" name="titre" required maxlength="200" />
    </label>
    <label class="block md:col-span-2">
      <span class="mc-label">Description</span>
      <textarea class="mc-input" rows="4" [(ngModel)]="description" name="description"></textarea>
    </label>
    <label class="block">
      <span class="mc-label">Compétence recherchée</span>
      <select class="mc-select" [(ngModel)]="competenceId" name="competenceId">
        <option value="">Aucune compétence précise</option>
        @for (item of competences; track item.id) {
          <option [value]="item.id">{{ item.nom }}</option>
        }
      </select>
    </label>
    <label class="block">
      <span class="mc-label">Niveau</span>
      <select class="mc-input" [(ngModel)]="niveau" name="niveau">
        <option value="DEBUTANT">Débutant</option>
        <option value="INTERMEDIAIRE">Intermédiaire</option>
        <option value="EXPERT">Expert</option>
        <option value="EXPERT">Expert</option>
      </select>
    </label>
    <label class="block">
      <span class="mc-label">Quantité</span>
      <input class="mc-input" type="number" min="1" [(ngModel)]="quantite" name="quantite" />
    </label>
    <label class="block">
      <span class="mc-label">Date de début</span>
      <input class="mc-input" type="date" [(ngModel)]="dateDebut" name="dateDebut" />
    </label>
    <label class="block">
      <span class="mc-label">Date de fin</span>
      <input class="mc-input" type="date" [(ngModel)]="dateFin" name="dateFin" />
    </label>
  </div>
  <div class="mt-6 flex gap-3">
    <button class="btn btn-primary" type="button" (click)="save()" [disabled]="saving || !titre.trim()">
      {{ saving ? 'Création…' : 'Créer le besoin' }}
    </button>
    <button class="btn btn-ghost" type="button" (click)="cancel()">Retour</button>
  </div>
</section>
}
