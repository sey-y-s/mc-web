<mc-page-header
  title="Tests numériques"
  description="Tests par compétence, questions, propositions et résultats transformables en preuve."
/>
<div class="grid gap-5 lg:grid-cols-2">
  <section class="mc-card p-5">
    <h2 class="font-semibold">Tests existants</h2>
    <mc-empty-state
      title="Aucun test disponible"
      message="Consultez les tests disponibles et transmettez vos résultats."
    />
  </section>
  <section class="mc-card p-5">
    <h2 class="font-semibold">Conception</h2>
    <p class="mc-muted mt-2">
      Créez et gérez les tests numériques depuis cet espace.
    </p>
    <button class="btn btn-primary mt-5 rounded-md">Créer un test</button>
  </section>
</div>
