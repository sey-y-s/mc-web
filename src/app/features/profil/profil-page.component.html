<mc-page-header title="Mon profil" description="Informations de votre compte." />
<section class="mc-card max-w-2xl p-6">
  <dl class="grid gap-5 sm:grid-cols-2">
    <div>
      <dt class="text-sm text-base-content/60">Rôle</dt>
      <dd class="mt-1 font-medium">{{ user?.role ?? 'Non disponible' }}</dd>
    </div>
    <div>
      <dt class="text-sm text-base-content/60">État du compte</dt>
      <dd class="mt-1 font-medium">{{ user?.actif === false ? 'Désactivé' : 'Actif' }}</dd>
    </div>
  </dl>
</section>
